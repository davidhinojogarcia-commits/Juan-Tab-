name: PLANIFICA Firebase integration
on:
  pull_request:
  push:
    branches: [main, 'feat/firebase-shared-integration']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Firestore rules and actual SDK transactions (demo data only)
        run: npx -y firebase-tools@14 emulators:exec --project demo-planifica --only firestore,auth 'npm run test:rules'
