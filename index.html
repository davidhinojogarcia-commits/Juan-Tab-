    <script>
      // Desactivar y limpiar Service Workers y cachés previas para garantizar carga fresca inmediata
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (let key of keys) {
            caches.delete(key);
          }
        });
      }
    </script>
